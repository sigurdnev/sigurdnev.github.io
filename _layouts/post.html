---
layout: default
---
<main class="content-shell">
  <article class="post container">
    <p class="post-back"><a href="{{ '/posts/' | relative_url }}">← Back to all posts</a></p>
    <header class="post-header">
      <h1>{{ page.title }}</h1>
      <p class="post-meta">{{ page.date | date: "%B %d, %Y" }}</p>
      {% if page.tags %}
      <div class="meta">
        {% for tag in page.tags %}
        <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
      {% endif %}
    </header>

    <div class="post-body">
      {{ content }}
    </div>
  </article>
</main>
